services:
  - type: web
    name: arbitrage-system
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn src.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: RUN_MODE
        value: OBSERVE
      - key: PYTHONHASHSEED
        value: "42"
      - key: RANDOM_SEED
        value: "42"
      - key: STATE_DIR
        value: /var/data/state
      - key: DATA_DIR
        value: /var/data/metrics
      - key: POLYMARKET_TOKENS
        sync: false
    disk:
      name: persistent-data
      mountPath: /var/data
      sizeGB: 1
