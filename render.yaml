services:
  - type: web
    name: polymarket-bot
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m src.orchestrator"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: RUN_MODE
        value: "OBSERVE"
      - key: ENABLE_DASHBOARD
        value: "true"
